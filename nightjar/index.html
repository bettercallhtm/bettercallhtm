<style>
  :root {
    color-scheme: dark;
    --bg: #0c1614;
    --panel: rgba(12, 20, 22, 0.94);
    --line: rgba(255, 255, 255, 0.12);
    --text: #e8f1ee;
    --muted: #9fb3ad;
    --accent: #1fd1b8;
    --danger: #ff5a4a;
    --gold: #ffd24a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; }
  .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(8,14,14,0.78), rgba(4,8,8,0.96)); z-index: 10;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .screen.on { display: flex; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px 24px; max-width: 560px; width: 100%;
    max-height: 100%; overflow: auto; text-align: center; touch-action: pan-y; }
  h1 { margin: 0 0 4px; font-size: clamp(28px, 6vw, 46px); letter-spacing: 3px; font-weight: 900; }
  h1 span { color: var(--accent); }
  h2 { margin: 0 0 12px; font-size: 22px; letter-spacing: 1px; }
  p { color: var(--muted); margin: 6px 0; line-height: 1.4; }
  .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; align-items: stretch; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button { font: inherit; font-weight: 700; font-size: 16px; color: var(--text); background: rgba(255,255,255,0.08);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; min-height: 48px; cursor: pointer; touch-action: manipulation; }
  button:active { transform: scale(0.97); }
  button.primary { background: var(--accent); color: #062521; border-color: transparent; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: 0.35; }
  .levels-wrap { width: 100%; max-width: 980px; max-height: 100%; display: flex; flex-direction: column; min-height: 0; }
  .carousel { position: relative; display: flex; align-items: center; gap: 6px; min-height: 0; }
  #actList { flex: 1; display: flex; gap: 14px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; touch-action: pan-x; scrollbar-width: none; padding: 4px 2px 8px; }
  #actList::-webkit-scrollbar { display: none; }
  .act { flex: 0 0 min(78vw, 520px); scroll-snap-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px; text-align: left; overflow: hidden; }
  .act h3 { margin: 8px 4px 8px; font-size: 17px; color: var(--text); font-weight: 800; letter-spacing: 1px; }
  .thumb { position: relative; width: 100%; aspect-ratio: 30 / 17; max-height: 42vh; border-radius: 10px; background: #0b1210 center / cover no-repeat; box-shadow: inset 0 0 0 1px var(--line); }
  .thumb.locked { filter: grayscale(0.85) brightness(0.45); }
  .thumb .actno { position: absolute; left: 8px; top: 6px; font-size: 11px; font-weight: 800; letter-spacing: 2px; color: rgba(255,255,255,0.85); text-shadow: 0 1px 3px #000; }
  .thumb .soon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
  .navbtn { flex: 0 0 auto; width: 40px; min-height: 64px; padding: 0; font-size: 26px; }
  .actdots { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
  .actdots i { width: 18px; height: 4px; border-radius: 2px; background: var(--line); cursor: pointer; }
  .actdots i.on { background: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
  .lv { position: relative; min-height: 46px; padding: 4px; font-size: 15px; }
  .lv .g { position: absolute; right: 3px; top: 1px; font-size: 11px; font-weight: 900; }
  .g.S { color: var(--gold); } .g.A { color: #6dffa6; } .g.B { color: #8fc8ff; } .g.C { color: #ffb347; } .g.D { color: #ff8a80; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; }

  table.stats td:last-child { text-align: right; font-weight: 700; }
  .setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); text-align: left; }
  .help { text-align: left; }
  .help li { margin: 6px 0; color: var(--muted); }
  .help b { color: var(--text); }
  #hint { position: fixed; left: 50%; top: max(10px, env(safe-area-inset-top)); transform: translateX(-50%); z-index: 5;
    max-width: min(620px, 70vw); background: rgba(8,14,14,0.82); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 14px; font-size: 14px; line-height: 1.35; text-align: center; pointer-events: none; transition: opacity 0.6s; opacity: 0; }
  #hint { background: linear-gradient(90deg, rgba(8,14,14,0), rgba(8,14,14,0.85) 20%, rgba(8,14,14,0.85) 80%, rgba(8,14,14,0)); border: 0; border-radius: 0; padding: 10px 60px; }
  #hint small { display: block; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); }
  #hint b { color: var(--text); display: block; font-size: 22px; letter-spacing: 2px; font-weight: 800; }
  #hint.show b { animation: cardin 0.7s ease both; }
  #hint.show small { animation: cardin 0.7s 0.1s ease both; }
  @keyframes cardin { from { opacity: 0; letter-spacing: 10px; } to { opacity: 1; } }
  .logo { text-shadow: 0 0 24px rgba(31,209,184,0.35); }
  .logo span { text-shadow: 0 0 18px rgba(31,209,184,0.8); }
  #rotate { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; flex-direction: column;
    background: var(--bg); text-align: center; padding: 24px; }

  @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
  .small { font-size: 13px; }
  @media (max-height: 420px) {
    .card { padding: 14px 18px; }

  .story { background: radial-gradient(ellipse at 30% 40%, rgba(10,20,20,0.55), rgba(3,6,6,0.94)); }
  .story .skip { position: absolute; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); min-height: 40px; padding: 8px 16px; }
  .story-body { max-width: 640px; width: 100%; text-align: left; display: flex; flex-direction: column; gap: 18px; align-items: flex-start; }
  .story-text { font-size: clamp(18px, 3.2vw, 26px); line-height: 1.45; color: var(--text); margin: 0; min-height: 4.4em; text-wrap: balance; animation: fadein 0.6s ease both; }
  .story-text b { color: var(--accent); letter-spacing: 1px; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 22px; height: 3px; border-radius: 2px; background: var(--line); }
  .dots i.on { background: var(--accent); }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .story-text { animation: none; } }
</style>

<script>
(() => {
const __mods = {};

// ---- js/core/const.js ----
__mods['js/core/const.js'] = (() => {
// Shared constants for the simulation. Units: pixels and seconds.
const TILE = 32;
const COLS = 30;
const ROWS = 17;
const W = COLS * TILE; // 960
const H = ROWS * TILE; // 544
const DT = 1 / 60;

// Tile kinds stored in the level grid.
const T = {
  EMPTY: 0,
  SOLID: 1,
  PLANK: 2, // one-way platform occupying the top PLANK_H px of the tile
  LADDER: 3,
  BUSH: 4, // passable cover: crouching inside hides the player
  WATER: 5, // deadly
  BREAK: 6, // plank that collapses shortly after being stood on
  DOOR: 7, // mechanical shutter: solid while closed, opens and closes on a cycle
};
const PLANK_H = 8;

const PLAYER = {
  w: 18,
  h: 44,
  crouchH: 28,
  walk: 135,
  crouchSpeed: 68,
  accel: 1500,
  friction: 1700,
  airAccel: 950,
  gravity: 1800,
  jumpV: 510,
  maxFall: 900,
  coyote: 0.1,
  jumpBuffer: 0.14,
  climbSpeed: 115,
  hangSpeed: 62,
  gripDrain: 0.3, // per second, grip is 0..1
  gripRegen: 1.2,
  climbUpTime: 0.3,
  dropHoldTime: 0.38,
  attackCooldown: 0.3,
  attackTime: 0.18,
  reach: 30,
  autoJumpDelay: 0.16,
};

// Sight is unlimited along the facing direction (walls, planks and low cover block it).
// Enemies react instantly and strike faster than the player can turn a fight around.
const SIGHT_RANGE = 40 * TILE;
const ENEMY_TYPES = {
  guard: { speed: 48, runSpeed: 200, reach: 32, windup: 0.12, pause: 1.1, heavy: false, gun: false },
  spear: { speed: 42, runSpeed: 180, reach: 56, windup: 0.14, pause: 1.3, heavy: false, gun: false },
  rifle: { speed: 40, runSpeed: 0, reach: 0, windup: 0.32, pause: 1.6, heavy: false, gun: true, fireEvery: 0.9 },
  heavy: { speed: 34, runSpeed: 130, reach: 36, windup: 0.2, pause: 1.4, heavy: true, gun: false },
  fast: { speed: 85, runSpeed: 240, reach: 32, windup: 0.1, pause: 0.45, heavy: false, gun: false },
};

const ENEMY_CHARS = {
  g: ['guard', 1], G: ['guard', -1],
  s: ['spear', 1], S: ['spear', -1],
  r: ['rifle', 1], R: ['rifle', -1],
  k: ['heavy', 1], K: ['heavy', -1],
  f: ['fast', 1], F: ['fast', -1],
};

const TRAP_CHARS = {
  '^': 'beartrap',
  e: 'electric',
  v: 'steam',
  w: 'wire',
  n: 'noisy',
  x: 'crusher',
  l: 'laser',
  p: 'panel', // security panel: attack it to shut down lasers and cameras for a while
  a: 'dart', // wall dart launcher shooting right
  A: 'dart', // ... shooting left
};
const DOOR_DEFAULTS = { open: 2.2, closed: 2.6, warn: 0.6, phase: 0 };
const DART = { speed: 420, height: 34 }; // flies above a crouched player's head

// Default timings (seconds) for cyclic traps: on = active, off = safe; warn = telegraph before on.
const TRAP_DEFAULTS = {
  electric: { on: 1.4, off: 2.0, warn: 0.6, phase: 0 },
  steam: { on: 1.2, off: 2.2, warn: 0.6, phase: 0 },
  crusher: { on: 0.8, off: 2.2, warn: 0.6, phase: 0 },
  laser: { on: 0, off: 0, warn: 0, phase: 0 }, // on=0 means always active
  dart: { on: 0.1, off: 2.1, warn: 0.5, phase: 0.6 },
};

const CAMERA = { range: 7.5 * TILE, halfAngle: 0.32, sweep: 0.9, period: 5, notice: 0.7 };
const PANEL_DISABLE_TIME = 7;
const GUN_AIM = 1.4; // max rifle aim angle above/below level (radians)

return { TILE, COLS, ROWS, W, H, DT, T, PLANK_H, PLAYER, SIGHT_RANGE, ENEMY_TYPES, ENEMY_CHARS, TRAP_CHARS, DOOR_DEFAULTS, DART, TRAP_DEFAULTS, CAMERA, PANEL_DISABLE_TIME, GUN_AIM };
})();

// ---- js/core/level.js ----
__mods['js/core/level.js'] = (() => {
const { TILE, COLS, ROWS, T, PLANK_H, ENEMY_CHARS, TRAP_CHARS, DOOR_DEFAULTS } = __mods['js/core/const.js'];

const TILE_CHARS = { '#': T.SOLID, '=': T.PLANK, H: T.LADDER, b: T.BUSH, '~': T.WATER, o: T.BREAK, d: T.DOOR };

function findOpt(list, c, r) {
  return (list || []).find((o) => o.at && o.at[0] === c && o.at[1] === r) || {};
}

// Parses a level definition (ASCII map + per-entity options) into a runtime layout.
function parseLevel(def) {
  if (!def || !Array.isArray(def.map)) throw new Error(`Level ${def && def.id}: missing map`);
  if (def.map.length !== ROWS) throw new Error(`Level ${def.id}: map must have ${ROWS} rows, got ${def.map.length}`);
  const grid = new Uint8Array(COLS * ROWS);
  const out = { def, grid, player: null, exit: null, enemies: [], traps: [], cameras: [] };
  for (let r = 0; r < ROWS; r++) {
    const row = def.map[r];
    if (row.length !== COLS) throw new Error(`Level ${def.id}: row ${r} must have ${COLS} chars, got ${row.length}`);
    for (let c = 0; c < COLS; c++) {
      const ch = row[c];
      const x = c * TILE + TILE / 2;
      const feet = (r + 1) * TILE;
      if (ch in TILE_CHARS) grid[r * COLS + c] = TILE_CHARS[ch];
      else if (ch === 'P') {
        if (out.player) throw new Error(`Level ${def.id}: more than one player start`);
        out.player = { x, y: feet, dir: 1, c, r };
      } else if (ch === 'X') {
        if (out.exit) throw new Error(`Level ${def.id}: more than one exit`);
        out.exit = { x: c * TILE + 2, y: feet - TILE * 2, w: TILE - 4, h: TILE * 2, c, r };
      } else if (ch in ENEMY_CHARS) {
        const [type, dir] = ENEMY_CHARS[ch];
        out.enemies.push({ type, x, y: feet, dir, c, r, opts: findOpt(def.enemies, c, r) });
      } else if (ch in TRAP_CHARS) {
        out.traps.push({ kind: TRAP_CHARS[ch], c, r, dir: ch === 'A' ? -1 : 1, opts: findOpt(def.traps, c, r) });
      } else if (ch === 'c' || ch === 'C') {
        out.cameras.push({ c, r, dir: ch === 'c' ? 1 : -1, opts: findOpt(def.cameras, c, r) });
      } else if (ch !== '.' && ch !== ' ') {
        throw new Error(`Level ${def.id}: unknown char '${ch}' at ${c},${r}`);
      }
    }
  }
  if (!out.player) throw new Error(`Level ${def.id}: missing player start 'P'`);
  if (!out.exit) throw new Error(`Level ${def.id}: missing exit 'X'`);
  return out;
}

// Mutable tile world for one play session (tracks collapsing planks).
class World {
  constructor(layout) {
    this.grid = layout.grid;
    this.breakState = new Map(); // index -> { t: seconds stood on, down: seconds broken }
    this.time = 0;
    this.forceDoorsOpen = false; // the validator treats doors as passable
    // Vertical runs of door cells form one door; timing options are keyed by the bottom cell.
    this.doors = [];
    this.doorAt = new Map();
    const opts = (layout.def && layout.def.doors) || [];
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        if (this.grid[r * COLS + c] !== T.DOOR || this.doorAt.has(r * COLS + c)) continue;
        let r1 = r;
        while (r1 + 1 < ROWS && this.grid[(r1 + 1) * COLS + c] === T.DOOR) r1++;
        const o = opts.find((d) => d.at && d.at[0] === c && d.at[1] === r1) || {};
        const door = { c, r0: r, r1, cfg: { ...DOOR_DEFAULTS, ...o }, open: false, openK: 0, warn: false, held: false };
        for (let rr = r; rr <= r1; rr++) this.doorAt.set(rr * COLS + c, door);
        this.doors.push(door);
      }
    }
    this.updateDoors(0);
    // Moving platforms: { at:[c,r], len, to:[c2,r2], period, phase } — a board of len tiles whose
    // top starts at row r and slides back and forth to (c2, r2).

// Central scoring. Stealth and clean execution weigh more than speed.
const GRADES = ['S', 'A', 'B', 'C', 'D'];

function computeGrade(stats, def = {}) {
  const th = { A: 85, B: 70, C: 50, ...(def.grade || {}) };
  const par = def.par || 60;
  let score = 100;
  score -= stats.alerts * 16;
  score -= stats.alarms * 12;
  score -= stats.noises * 3;
  score -= stats.loudKills * 10;
  score -= (stats.shots || 0) * 6;
  score -= Math.min(30, stats.restarts * 5);
  if (stats.time > par) score -= Math.min(20, ((stats.time - par) / par) * 25);
  score = Math.max(0, Math.round(score));
  const clean = stats.alerts === 0 && stats.alarms === 0 && stats.loudKills === 0 && stats.restarts === 0;
  let grade;
  if (clean && score >= 95) grade = 'S';
  else if (score >= th.A) grade = 'A';
  else if (score >= th.B) grade = 'B';
  else if (score >= th.C) grade = 'C';
  else grade = 'D';
  return { grade, score };
}

function betterGrade(a, b) {
  if (!a) return b;
  if (!b) return a;
  return GRADES.indexOf(a) <= GRADES.indexOf(b) ? a : b;
}

// Campaign grade from the per-level best grades.
function campaignGrade(levelResults, total) {
  const pts = { S: 5, A: 4, B: 3, C: 2, D: 1 };
  let sum = 0;
  let n = 0;
  for (const r of Object.values(levelResults)) {
    if (!r || !r.grade) continue;
    sum += pts[r.grade];
    n++;
  }
  if (!n) return 'D';
  const avg = (sum / Math.max(n, total || n));
  if (avg >= 4.6) return 'S';
  if (avg >= 3.8) return 'A';
  if (avg >= 3) return 'B';
  if (avg >= 2) return 'C';
  return 'D';
}

return { GRADES, computeGrade, betterGrade, campaignGrade };
})();

    g.stroke();
    g.fillStyle = 'rgba(255,80,60,0.8)';
    g.fillRect(x + armR - 3, top - 4, 3, 3);
  }
}

function gantries(g, bw, rand, color) {
  g.strokeStyle = color;
  g.fillStyle = color;
  for (let i = 0; i < 2; i++) {
    const x = 80 + rand() * (bw - 260);
    const top = 50 + rand() * 40;
    const span = 150 + rand() * 60;
    g.lineWidth = 5;
    g.beginPath();
    g.moveTo(x, H);
    g.lineTo(x, top);
    g.moveTo(x + span, H);
    g.lineTo(x + span, top);
    g.stroke();
    g.fillRect(x - 60, top - 8, span + 140, 9);
    g.lineWidth = 1.5;
    for (let k = x - 50; k < x + span + 70; k += 16) {
      g.beginPath();
      g.moveTo(k, top - 8);
      g.lineTo(k + 8, top);
      g.stroke();
    }
    g.fillRect(x + span * (0.3 + rand() * 0.4), top + 1, 14, 10);
    g.fillStyle = 'rgba(255,90,60,0.9)';
    g.fillRect(x + span + 76, top - 12, 3, 3);
    g.fillStyle = color;
  }
}

function containers(g, bw, rand) {
  const palette = ['#7a3b2e', '#2f5e6b', '#3c4a6b', '#8a6a2a', '#4f6a45', '#6b2f3f'];
  let x = -10;
  while (x < bw) {
    const stack = 1 + Math.floor(rand() * 4);
    const wd = 70 + Math.floor(rand() * 2) * 40;
    for (let k = 0; k < stack; k++) {
      const y = H - 60 - (k + 1) * 30;
      const col = palette[Math.floor(rand() * palette.length)];
      g.fillStyle = col;
      g.fillRect(x, y, wd, 28);
      g.fillStyle = 'rgba(0,0,0,0.45)';
      g.fillRect(x, y, wd, 28);
      g.fillStyle = 'rgba(255,255,255,0.05)';
      for (let rib = x + 4; rib < x + wd - 2; rib += 5) g.fillRect(rib, y + 2, 1.5, 24);
      g.fillStyle = 'rgba(0,0,0,0.35)';
      g.fillRect(x, y + 26, wd, 2);
    }
    x += wd + 6 + rand() * 30;
  }
}

function trusses(g, bw, rand, color) {
  g.strokeStyle = color;
  g.lineWidth = 4;
  g.beginPath();
  g.moveTo(0, 26);
  g.lineTo(bw, 26);
  g.moveTo(0, 6);
  g.lineTo(bw, 6);
  g.stroke();
  g.lineWidth = 2;
  for (let x = 0; x < bw; x += 40) {
    g.beginPath();
    g.moveTo(x, 26);
    g.lineTo(x + 20, 6);
    g.lineTo(x + 40, 26);
    g.stroke();
  }
  // Hanging chains.
  g.lineWidth = 1.5;
  for (let i = 0; i < 5; i++) {
    const x = rand() * bw;
    const len = 60 + rand() * 140;
    g.setLineDash([3, 2]);
    g.beginPath();
    g.moveTo(x, 26);
    g.lineTo(x, 26 + len);
    g.stroke();
    g.setLineDash([]);
    g.beginPath();
    g.arc(x, 30 + len, 5, 0, Math.PI);
    g.stroke();
  }
}

// Concrete back wall for interiors: panel seams, stains, a few dim wall lamps.
function backWall(g, bw, th, rand) {
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, th.sky[0]);
  grd.addColorStop(1, th.sky[1]);
  g.fillStyle = grd;
  g.fillRect(0, 0, bw, H);
  g.strokeStyle = 'rgba(0,0,0,0.35)';
  g.lineWidth = 1;
  for (let y = 24; y < H; y += 48) {
    g.beginPath();
    g.moveTo(0, y);
    g.lineTo(bw, y);
    g.stroke();
  }
  for (let y = 24; y < H; y += 48) {
    for (let x = (y / 48) % 2 ? 0 : 40; x < bw; x += 80) {
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x, y + 48);
      g.stroke();
    }
  }
  for (let i = 0; i < 14; i++) {
    const x = rand() * bw;
    const y = rand() * H;
    const st = g.createLinearGradient(x, y, x, y + 60 + rand() * 60);
    st.addColorStop(0, 'rgba(0,0,0,0.18)');
    st.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = st;
    g.fillRect(x, y, 6 + rand() * 14, 120);
  }
  for (let i = 0; i < 4; i++) {
    const x = rand() * bw;
    const y = 30 + rand() * 90;
    const glow = g.createRadialGradient(x, y, 2, x, y, 90);
    glow.addColorStop(0, 'rgba(180,230,210,0.22)');
    glow.addColorStop(1, 'rgba(180,230,210,0)');
    g.fillStyle = glow;
    g.fillRect(x - 90, y - 90, 180, 180);
    g.fillStyle = 'rgba(210,240,225,0.8)';
    g.fillRect(x - 8, y - 2, 16, 4);
  }
}

function bigPipes(g, bw, rand, color) {
  for (let i = 0; i < 4; i++) {
    const y = 40 + i * (H / 4.5) + rand() * 30;
    const r = 10 + rand() * 12;
    const grd = g.createLinearGradient(0, y - r, 0, y + r);
    grd.addColorStop(0, 'rgba(255,255,255,0.08)');
    grd.addColorStop(0.4, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(0,0,0,0.35)');
    g.fillStyle = color;
    g.fillRect(0, y - r, bw, r * 2);
    g.fillStyle = grd;
    g.fillRect(0, y - r, bw, r * 2);
    for (let x = 30 + rand() * 60; x < bw; x += 90 + rand() * 60) {
      // Flanges and valves.
      g.fillStyle = 'rgba(0,0,0,0.35)';
      g.fillRect(x, y - r - 3, 8, r * 2 + 6);
      if (rand() < 0.35) {
        g.strokeStyle = '#a0342a';
        g.lineWidth = 3;
        g.beginPath();
        g.arc(x + 4, y - r - 10, 7, 0, Math.PI * 2);
        g.stroke();
        g.fillStyle = color;
        g.fillRect(x + 2, y - r - 10, 4, 10);
      }
    }
  }
}

function cables(g, bw, rand, color) {
  g.strokeStyle = color;
  for (let i = 0; i < 7; i++) {
    g.lineWidth = 2 + rand() * 3;
    const x0 = rand() * bw;
    const x1 = x0 + 80 + rand() * 200;
    const sag = 30 + rand() * 60;
    g.beginPath();
    g.moveTo(x0, 8);
    g.quadraticCurveTo((x0 + x1) / 2, 8 + sag * 2, x1, 8);
    g.stroke();
  }
  for (let i = 0; i < 3; i++) {
    const x = rand() * bw;
    const y = H * 0.35 + rand() * H * 0.3;
    g.fillStyle = color;
    g.fillRect(x, y, 46, 34);
    g.fillStyle = 'rgba(0,0,0,0.5)';
    for (let k = 0; k < 5; k++) g.fillRect(x + 4, y + 4 + k * 6, 38, 3);
  }
}

function serverRacks(g, bw, rand, color) {
  let x = 0;
  while (x < bw) {
    const wd = 34 + rand() * 20;
    const top = H * (0.12 + rand() * 0.2);
    g.fillStyle = color;
    g.fillRect(x, top, wd, H - top);
    g.fillStyle = 'rgba(0,0,0,0.35)';
    for (let y = top + 6; y < H - 10; y += 12) g.fillRect(x + 3, y, wd - 6, 8);
    for (let y = top + 9; y < H - 10; y += 12) {
      if (rand() < 0.6) {
        g.fillStyle = rand() < 0.75 ? 'rgba(80,255,150,0.8)' : 'rgba(255,120,60,0.8)';
        g.fillRect(x + wd - 9, y, 2, 2);
      }
    }
    x += wd + 10 + rand() * 30;
  }
}

function monitorWall(g, bw, rand) {
  for (let i = 0; i < 5; i++) {
    const x = rand() * (bw - 120);
    const y = 30 + rand() * (H * 0.35);
    const cols = 2 + Math.floor(rand() * 3);
    for (let k = 0; k < cols; k++) {
      const mx = x + k * 44;
      g.fillStyle = '#10141c';
      g.fillRect(mx, y, 40, 28);
      g.fillStyle = 'rgba(70,150,255,0.35)';
      g.fillRect(mx + 3, y + 3, 34, 22);
      g.fillStyle = 'rgba(160,210,255,0.5)';
      for (let l = 0; l < 3; l++) g.fillRect(mx + 6, y + 7 + l * 6, 10 + rand() * 18, 2);
    }
  }
}

function reactor(g, bw, rand) {
  const cx = bw * (0.35 + rand() * 0.3);
  const cy = H * 0.42;
  const glow = g.createRadialGradient(cx, cy, 10, cx, cy, 260);
  glow.addColorStop(0, 'rgba(210,140,255,0.45)');
  glow.addColorStop(0.4, 'rgba(150,80,255,0.15)');
  glow.addColorStop(1, 'rgba(150,80,255,0)');
  g.fillStyle = glow;
  g.fillRect(0, 0, bw, H);
  g.strokeStyle = 'rgba(200,150,255,0.35)';
  for (let i = 0; i < 4; i++) {
    g.lineWidth = 3 + i * 2;
    g.beginPath();
    g.ellipse(cx, cy, 60 + i * 38, 22 + i * 14, 0, 0, Math.PI * 2);
    g.stroke();
  }
  g.fillStyle = 'rgba(240,210,255,0.8)';
  g.beginPath();
  g.arc(cx, cy, 20, 0, Math.PI * 2);
  g.fill();
}

function conduits(g, bw, rand, color) {
  for (let i = 0; i < 6; i++) {
    const x = rand() * bw;
    g.fillStyle = color;
    g.fillRect(x, 0, 14, H);
    g.fillStyle = 'rgba(190,120,255,0.35)';
    g.fillRect(x + 5, 0, 4, H);
  }
}

function ships(g, bw, rand, color) {
  g.fillStyle = color;
  for (let i = 0; i < 2; i++) {
    const x = rand() * (bw - 260);
    const base = H * 0.72;
    const len = 200 + rand() * 80;
    g.beginPath();
    g.moveTo(x, base - 30);
    g.lineTo(x + len, base - 30);
    g.lineTo(x + len - 20, base);
    g.lineTo(x + 16, base);
    g.fill();
    g.fillRect(x + len * 0.6, base - 70, 50, 40);
    g.fillRect(x + len * 0.65, base - 95, 8, 25);
    g.fillStyle = 'rgba(255,214,140,0.6)';
    for (let k = 0; k < 4; k++) g.fillRect(x + len * 0.6 + 6 + k * 11, base - 60, 5, 5);
    g.fillStyle = color;
  }
}

function antennas(g, bw, rand, color) {
  g.strokeStyle = color;
  g.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    const x = rand() * bw;
    const top = 20 + rand() * 60;
    g.beginPath();
    g.moveTo(x - 20, H);
    g.lineTo(x, top);
    g.lineTo(x + 20, H);
    g.stroke();
    g.fillStyle = 'rgba(255,60,60,0.9)';
    g.fillRect(x - 2, top - 3, 4, 4);
  }
}

function scaffoldFrames(g, bw, rand, color) {
  g.strokeStyle = color;
  g.lineWidth = 4;
  for (let i = 0; i < 3; i++) {
    const x = rand() * bw;
    const wd = 90 + rand() * 80;
    const top = H * (0.2 + rand() * 0.2);
    for (let y = top; y < H; y += 46) {
      g.strokeRect(x, y, wd, 46);
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x + wd, y + 46);
      g.stroke();
    }
  }
}

function crateStacks(g, bw, rand, color) {
  for (let i = 0; i < 6; i++) {
    const x = rand() * bw;
    const cols = 1 + Math.floor(rand() * 3);
    const rows = 1 + Math.floor(rand() * 4);
    for (let cx = 0; cx < cols; cx++) {
      for (let cy = 0; cy < rows; cy++) {
        const bx = x + cx * 34;
        const by = H - 40 - (cy + 1) * 30;
        g.fillStyle = color;
        g.fillRect(bx, by, 32, 28);
        g.strokeStyle = 'rgba(255,255,255,0.05)';
        g.strokeRect(bx + 3, by + 3, 26, 22);
      }
    }
  }
}

function pipes(g, bw, rand, color) {
  g.strokeStyle = color;
  for (let i = 0; i < 5; i++) {
    g.lineWidth = 8 + rand() * 10;
    const y = 30 + rand() * (H - 140);
    g.beginPath();
    g.moveTo(0, y);
    const bendX = rand() * bw;
    g.lineTo(bendX, y);
    g.lineTo(bendX + 40, y + 40);
    g.lineTo(bw, y + 40);
    g.stroke();
  }
}

// ---------------------------------------------------------------- tiles
function paintShadows(g, w) {
  // Soft contact shadows cast downward by planks and overhangs onto the backdrop.
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const solid = w.solid(c, r);
      const plank = w.isPlankLike(c, r);
      if (!solid && !plank) continue;
      if (w.solid(c, r + 1) || r + 1 >= ROWS) continue;
      const y0 = r * TILE + (plank ? PLANK_H : TILE);
      const gr = g.createLinearGradient(0, y0, 0, y0 + 26);
      gr.addColorStop(0, 'rgba(0,0,0,0.32)');
      gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr;
      g.fillRect(c * TILE - 2, y0, TILE + 4, 26);
    }
  }
}

function paintSupports(g, w, th) {
  // Background posts under planks (decor only).
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (!w.isPlankLike(c, r)) continue;
      const endL = !w.isPlankLike(c - 1, r);
      const endR = !w.isPlankLike(c + 1, r);
      if (!(endL || endR || c % 4 === 0)) continue;
      let rr = r + 1;
      while (rr < ROWS && !w.solid(c, rr)) rr++;
      const px = c * TILE + (endL ? 4 : endR ? TILE - 10 : TILE / 2 - 3);
      const top = r * TILE + PLANK_H;
      const hgt = rr * TILE - top;
      g.fillStyle = shade(th.plankDark, -35);
      g.fillRect(px, top, 6, hgt);
      g.fillStyle = 'rgba(255,255,255,0.06)';
      g.fillRect(px, top, 2, hgt);
      if (hgt > 50 && (endL || endR)) {
        // Diagonal brace.
        g.strokeStyle = shade(th.plankDark, -40);
        g.lineWidth = 3;
        g.beginPath();
        const dir = endL ? 1 : -1;
        g.moveTo(px + 3, top + 4);
        g.lineTo(px + 3 + dir * 26, top + Math.min(hgt, 60));
        g.stroke();
      }
    }
  }
}

function paintSolid(g, w, c, r, x, y, th, mat, rand) {
  const open = (cc, rr) => !w.solid(cc, rr);
  const topOpen = open(c, r - 1) && r > 0;
  // Base with a vertical gradient: lit near the surface, darker deeper down.
  let depth = 0;
  for (let rr = r - 1; rr >= 0 && w.solid(c, rr); rr--) depth++;
  const k = Math.min(1, depth / 3);
  g.fillStyle = th.ground;
  g.fillRect(x, y, TILE, TILE);
  g.fillStyle = `rgba(0,0,0,${0.1 + k * 0.25})`;
  g.fillRect(x, y, TILE, TILE);

  if (mat === 'earth') {
    g.fillStyle = th.groundDark;
    for (let i = 0; i < 4; i++) {
      g.beginPath();
      g.ellipse(x + rand() * TILE, y + rand() * TILE, 2 + rand() * 4, 1.5 + rand() * 2, 0, 0, Math.PI * 2);
      g.fill();
    }
    g.fillStyle = 'rgba(255,255,255,0.05)';
    for (let i = 0; i < 2; i++) g.fillRect(x + rand() * 28, y + rand() * 28, 3, 2);
    if (rand() < 0.15 && depth > 0) {
      g.strokeStyle = 'rgba(40,25,15,0.7)';
      g.lineWidth = 1.5;
      g.beginPath();
      const rx = x + rand() * TILE;
      g.moveTo(rx, y);
      g.quadraticCurveTo(rx + 8, y + 14, rx - 4, y + TILE);
      g.stroke();
    }
  } else if (mat === 'sandstone') {
    // Continuous strata bands across the level.
    for (let i = 0; i < 4; i++) {
      const band = (r * 4 + i) % 5;
      g.fillStyle = band === 0 ? 'rgba(255,220,170,0.12)' : band === 3 ? 'rgba(80,30,10,0.14)' : 'rgba(0,0,0,0)';
      g.fillRect(x, y + i * 8, TILE, 8);
    }
    if (rand() < 0.2) {
      g.strokeStyle = 'rgba(60,25,10,0.5)';
      g.lineWidth = 1;
      g.beginPath();
      const cx = x + rand() * TILE;
      g.moveTo(cx, y + rand() * 10);
      g.lineTo(cx + 5, y + 16);
      g.lineTo(cx - 2, y + 28);
      g.stroke();
    }
  } else if (mat === 'concrete' || mat === 'tech') {
    g.fillStyle = 'rgba(255,255,255,0.04)';
    for (let i = 0; i < 6; i++) g.fillRect(x + rand() * 30, y + rand() * 30, 1.5, 1.5);
    g.fillStyle = 'rgba(0,0,0,0.18)';
    for (let i = 0; i < 5; i++) g.fillRect(x + rand() * 30, y + rand() * 30, 1.5, 1.5);
    if ((c + r) % 3 === 0) {
      g.fillStyle = 'rgba(0,0,0,0.25)';
      g.fillRect(x, y + TILE - 1, TILE, 1);
      g.fillRect(x + TILE - 1, y, 1, TILE);
    }
    if (mat === 'tech' && (c * 7 + r) % 5 === 0) {
      g.fillStyle = 'rgba(160,110,255,0.35)';
      g.fillRect(x + 6, y + 14, TILE - 12, 2);
    }
  }

  // Exposed faces.
  if (topOpen) {
    if (mat === 'earth') {
      g.fillStyle = shade(th.groundTop, -20);
      g.fillRect(x, y, TILE, 7);
      g.fillStyle = th.groundTop;
      g.fillRect(x, y, TILE, 5);
      g.fillStyle = 'rgba(255,255,255,0.18)';
      g.fillRect(x, y, TILE, 1.5);
      // Moss drips.
      g.fillStyle = shade(th.groundTop, -25);
      for (let i = 0; i < 3; i++) {
        const dx = x + rand() * (TILE - 4);
        g.fillRect(dx, y + 6, 3, 2 + rand() * 5);
      }
    } else if (mat === 'sandstone') {
      g.fillStyle = th.groundTop;
      g.fillRect(x, y, TILE, 5);
      g.fillStyle = 'rgba(255,240,210,0.3)';
      g.fillRect(x, y, TILE, 1.5);
    } else {
      g.fillStyle = th.groundTop;
      g.fillRect(x, y, TILE, 4);
      g.fillStyle = 'rgba(255,255,255,0.25)';
      g.fillRect(x, y, TILE, 1);
      if (mat === 'concrete' && rand() < 0.08) {
        // Rebar stub.
        g.strokeStyle = '#7a4a2a';
        g.lineWidth = 2;
        g.beginPath();
        const bx = x + 6 + rand() * 20;
        g.moveTo(bx, y);
        g.lineTo(bx + 2, y - 7);
        g.stroke();
      }
    }
  }
  g.fillStyle = 'rgba(0,0,0,0.4)';
  if (open(c - 1, r) && c > 0) g.fillRect(x, y, 3, TILE);
  if (open(c + 1, r) && c < COLS - 1) g.fillRect(x + TILE - 3, y, 3, TILE);
  if (open(c, r + 1) && r < ROWS - 1) {
    g.fillRect(x, y + TILE - 4, TILE, 4);
    if (mat === 'earth' && rand() < 0.4) {
      // Hanging roots.
      g.strokeStyle = 'rgba(50,32,20,0.9)';
      g.lineWidth = 1.2;
      g.beginPath();
      const rx = x + rand() * TILE;
      g.moveTo(rx, y + TILE);
      g.quadraticCurveTo(rx + 4, y + TILE + 6, rx - 2, y + TILE + 10 + rand() * 8);
      g.stroke();
    }
  }
  g.fillStyle = 'rgba(255,255,255,0.07)';
  if (open(c - 1, r) && c > 0) g.fillRect(x + 3, y, 1, TILE);
}

function paintPlank(g, w, c, r, x, y, th, mat) {
  if (mat === 'steel') {
    g.fillStyle = th.plankDark;
    g.fillRect(x, y, TILE, PLANK_H);
    g.fillStyle = th.plank;
    g.fillRect(x, y, TILE, PLANK_H - 3);
    g.fillStyle = 'rgba(0,0,0,0.3)';
    for (let i = 4; i < TILE; i += 9) g.fillRect(x + i, y + 2, 2, 2);
    g.fillStyle = 'rgba(255,255,255,0.3)';
    g.fillRect(x, y, TILE, 1);
    if (!w.isPlankLike(c - 1, r) || !w.isPlankLike(c + 1, r)) {
      // Hazard striping on the ends.
      g.save();
      g.beginPath();
      g.rect(x, y, TILE, PLANK_H - 3);
      g.clip();
      g.fillStyle = 'rgba(20,20,20,0.55)';
      for (let i = -8; i < TILE; i += 8) {
        g.beginPath();
        g.moveTo(x + i, y + PLANK_H);
        g.lineTo(x + i + 4, y + PLANK_H);
        g.lineTo(x + i + 8, y);
        g.lineTo(x + i + 4, y);
        g.fill();
      }
      g.restore();
    }
    return;
  }
  g.fillStyle = th.plankDark;
  g.fillRect(x, y, TILE, PLANK_H);
  g.fillStyle = th.plank;
  g.fillRect(x, y, TILE, PLANK_H - 3);
  g.strokeStyle = 'rgba(60,30,10,0.35)';
  g.lineWidth = 0.8;
  g.beginPath();
  g.moveTo(x, y + 2.5);
  g.lineTo(x + TILE, y + 2 + ((c * 13) % 3) * 0.5);
  g.stroke();
  g.fillStyle = 'rgba(0,0,0,0.35)';
  g.fillRect(x + TILE - 1, y, 1, PLANK_H);
  g.fillStyle = '#2a2a2a';
  g.fillRect(x + 3, y + 2, 1.5, 1.5);
  g.fillRect(x + TILE - 5, y + 2, 1.5, 1.5);

        ctx.strokeStyle = th.bushDark;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x + 9, y - 32);
        ctx.lineTo(x + 7, y - 5);
        ctx.moveTo(x + 22, y - 33);
        ctx.lineTo(x + 25, y - 5);
        ctx.moveTo(x + 2, y - 18);
        ctx.lineTo(x + TILE - 2, y - 20);
        ctx.stroke();
      }
    }
  }

  drawExit(ctx, game, t) {
    const e = game.exit;
    const open = game.exitOpen;
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(e.x - 3, e.y - 4, e.w + 6, e.h + 4);
    ctx.fillStyle = open ? '#2a4a3a' : '#3a2a2a';
    ctx.fillRect(e.x, e.y, e.w, e.h);
    if (open) {
      const glow = 0.4 + 0.3 * Math.sin(t * 4);
      ctx.fillStyle = `rgba(90,255,160,${glow})`;
      ctx.fillRect(e.x + 3, e.y + 3, e.w - 6, e.h - 6);
      ctx.fillStyle = '#eafff2';
      ctx.beginPath();
      const cx = e.x + e.w / 2;
      const cy = e.y + e.h / 2;
      ctx.moveTo(cx - 6, cy - 8);
      ctx.lineTo(cx + 7, cy);
      ctx.lineTo(cx - 6, cy + 8);
      ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 2;
      for (let i = 1; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(e.x, e.y + (i * e.h) / 4);
        ctx.lineTo(e.x + e.w, e.y + (i * e.h) / 4);
        ctx.stroke();
      }
    }
    ctx.fillStyle = open ? '#5cff9a' : '#ff4a4a';
    ctx.beginPath();
    ctx.arc(e.x + e.w / 2, e.y - 8, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }

  drawTrap(ctx, tr, game, t) {
    const x = tr.x;
    const fy = tr.floorY;
    const st = tr.state;
    switch (tr.kind) {
      case 'beartrap': {
        const cx = x + TILE / 2;
        ctx.fillStyle = '#2b2b2b';
        ctx.fillRect(x + 4, fy - 3, TILE - 8, 3);
        ctx.strokeStyle = '#b8b8b8';
        ctx.fillStyle = '#d8d8d8';
        ctx.lineWidth = 2;
        if (tr.sprung) {
          ctx.beginPath();
          ctx.moveTo(cx - 10, fy - 3);
          ctx.lineTo(cx, fy - 14);
          ctx.lineTo(cx + 10, fy - 3);
          ctx.stroke();
        } else {
          for (const side of [-1, 1]) {
            ctx.beginPath();
            ctx.arc(cx + side * 7, fy - 3, 7, Math.PI, 0);
            ctx.stroke();
            for (let i = 0; i < 3; i++) {
              const tx = cx + side * 7 + (i - 1) * 4;
              ctx.beginPath();
              ctx.moveTo(tx - 1.5, fy - 7);
              ctx.lineTo(tx, fy - 11);
              ctx.lineTo(tx + 1.5, fy - 7);
              ctx.fill();
            }
          }
          ctx.fillStyle = 'rgba(255,60,60,0.8)';
          ctx.beginPath();
          ctx.arc(cx, fy - 4, 2, 0, Math.PI * 2);
          ctx.fill();
        }
        break;
      }
      case 'electric': {
        ctx.fillStyle = '#3a3f46';
        ctx.fillRect(x + 1, fy - 5, TILE - 2, 5);
        ctx.fillStyle = st.active ? '#9ff3ff' : st.warn ? (Math.sin(t * 40) > 0 ? '#ffd24a' : '#3a3f46') : '#556070';
        ctx.fillRect(x + 3, fy - 4, TILE - 6, 2);
        if (st.active || st.warn) {
          ctx.strokeStyle = st.active ? '#c8fbff' : 'rgba(255,220,90,0.8)';
          ctx.lineWidth = st.active ? 2 : 1;
          ctx.beginPath();
          for (let i = 0; i < 4; i++) {
            const sx = x + 4 + i * 8;
            ctx.moveTo(sx, fy - 5);
            ctx.lineTo(sx + 3, fy - (st.active ? 14 : 8) - Math.random() * 4);
            ctx.lineTo(sx + 5, fy - 5);
          }
          ctx.stroke();
        }
        break;
      }
      case 'steam': {
        ctx.fillStyle = '#2e3338';
        ctx.fillRect(x + 5, fy - 5, TILE - 10, 5);
        ctx.fillStyle = '#626a72';
        for (let i = 0; i < 3; i++) ctx.fillRect(x + 8 + i * 6, fy - 4, 3, 3);
        if (st.active || st.warn) {
          const hgt = st.active ? TILE * 2.6 : 12;
          const n = st.active ? 10 : 3;
          for (let i = 0; i < n; i++) {
            const k = ((t * 3 + i / n) % 1);
            ctx.fillStyle = `rgba(235,240,245,${(st.active ? 0.55 : 0.3) * (1 - k)})`;
            ctx.beginPath();
            ctx.arc(x + TILE / 2 + Math.sin(i * 7 + t * 5) * 5, fy - 6 - k * hgt, 6 + k * 8, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        break;
      }
      case 'crusher': {
        const hy = tr.crusherHeadY();
        ctx.fillStyle = '#4a4f56';
        ctx.fillRect(x + TILE / 2 - 4, tr.ceilY, 8, hy - 18 - tr.ceilY);
        ctx.fillStyle = st.warn ? '#b83a2a' : '#6a7078';
        ctx.fillRect(x + 1, hy - 18, TILE - 2, 18);
        ctx.fillStyle = '#2a2d31';
        for (let i = 0; i < 4; i++) ctx.fillRect(x + 3 + i * 7, hy - 4, 4, 4);
        ctx.fillStyle = 'rgba(255,200,0,0.7)';
        ctx.fillRect(x + 1, hy - 18, TILE - 2, 3);
        break;
      }
      case 'wire': {
        ctx.fillStyle = '#6b5a45';
        ctx.fillRect(x + 1, fy - 14, 3, 14);
        ctx.fillRect(x + TILE - 4, fy - 14, 3, 14);
        ctx.strokeStyle = tr.sprung ? 'rgba(200,200,200,0.4)' : '#e8e0c8';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        if (tr.sprung) {
          ctx.moveTo(x + 3, fy - 12);
          ctx.lineTo(x + 10, fy - 2);
          ctx.moveTo(x + TILE - 3, fy - 12);
          ctx.lineTo(x + TILE - 10, fy - 2);
        } else {
          ctx.moveTo(x + 3, fy - 11);
          ctx.lineTo(x + TILE - 3, fy - 11);
        }
        ctx.stroke();
        if (!tr.sprung) {
          ctx.fillStyle = '#d9b44a';
          ctx.beginPath();
          ctx.arc(x + TILE / 2, fy - 9, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
        break;
      }
      case 'laser': {
        const w = game.world;
        const endL = !game.traps.some((o) => o.kind === 'laser' && o.r === tr.r && o.c === tr.c - 1);
        const endR = !game.traps.some((o) => o.kind === 'laser' && o.r === tr.r && o.c === tr.c + 1);
        ctx.fillStyle = '#3a3a44';
        if (endL) ctx.fillRect(x, fy - 44, 5, 44);
        if (endR) ctx.fillRect(x + TILE - 5, fy - 44, 5, 44);
        const on = st.active && !tr.disabled;
        if (on) {
          ctx.fillStyle = 'rgba(255,40,60,0.9)';
          ctx.fillRect(x, fy - 39, TILE, 2);
          ctx.fillStyle = 'rgba(255,40,60,0.25)';
          ctx.fillRect(x, fy - 42, TILE, 8);
        } else if (tr.cfg.on && st.warn && !tr.disabled) {
          ctx.fillStyle = 'rgba(255,40,60,0.35)';
          ctx.fillRect(x, fy - 39, TILE, 1);
        }
        void w;
        break;
      }
      case 'noisy': {
        ctx.fillStyle = '#5b5f63';
        ctx.fillRect(x + 1, fy - 3, TILE - 2, 3);
        ctx.fillStyle = '#8a9096';
        for (let i = 0; i < 6; i++) ctx.fillRect(x + 2 + i * 5, fy - 4, 2, 2);
        break;
      }
      case 'dart': {
        // Stone launcher mouth at dart height; glows red just before it fires.
        const y0 = fy - 34;
        const face = tr.dir > 0 ? x + 2 : x + TILE - 12;
        ctx.fillStyle = '#4a3a2e';
        ctx.fillRect(face, y0 - 9, 10, 18);
        ctx.fillStyle = '#2a1f18';
        ctx.fillRect(face + (tr.dir > 0 ? 6 : 0), y0 - 3, 4, 6);
        if (st.warn || st.active) {
          ctx.fillStyle = `rgba(255,70,40,${st.active ? 0.95 : 0.4 + 0.4 * Math.abs(Math.sin(t * 20))})`;
          ctx.fillRect(face + (tr.dir > 0 ? 6 : 0), y0 - 3, 4, 6);
        }
        break;
      }
      case 'panel': {
        const off = game.panelT > 0;
        ctx.fillStyle = '#2c313a';
        ctx.fillRect(x + 6, fy - 40, TILE - 12, 30);
        ctx.fillStyle = off ? '#4aa3ff' : '#4dff88';
        ctx.fillRect(x + 10, fy - 36, TILE - 20, 10);
        ctx.fillStyle = '#1b1f25';
        ctx.fillRect(x + TILE / 2 - 2, fy - 10, 4, 10);
        if (off) {
          ctx.fillStyle = '#9fd0ff';
          ctx.font = 'bold 9px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(Math.ceil(game.panelT), x + TILE / 2, fy - 44);
        }
        break;
      }
    }
  }

  drawCamera(ctx, cam, game) {
    const th = cam.disabled;
    ctx.save();
    if (!th) {
      const a = cam.angle;
      ctx.fillStyle = cam.seeing ? 'rgba(255,60,60,0.22)' : 'rgba(255,230,120,0.10)';
      ctx.beginPath();
      ctx.moveTo(cam.x, cam.y);
      const steps = 10;
      for (let i = 0; i <= steps; i++) {
        const aa = a - CAMERA.halfAngle + (2 * CAMERA.halfAngle * i) / steps;
        const dx = Math.cos(aa) * cam.dir;
        const dy = Math.sin(aa);
        let d = 0;
        while (d < cam.range && !game.world.blocksSight(cam.x + dx * d, cam.y + dy * d)) d += 6;
        ctx.lineTo(cam.x + dx * d, cam.y + dy * d);
      }
      ctx.closePath();
      ctx.fill();
    }
    ctx.translate(cam.x, cam.y);
    ctx.fillStyle = '#2a2e35';
    ctx.fillRect(-cam.dir * 10 - 3, -12, 6, 10);
    ctx.rotate(cam.dir > 0 ? cam.angle : Math.PI - cam.angle);
    ctx.fillStyle = '#c9ced6';
    ctx.fillRect(-6, -5, 16, 10);
    ctx.fillStyle = th ? '#555' : cam.seeing ? '#ff3030' : '#30ff80';
    ctx.beginPath();
    ctx.arc(10, 0, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Sight reaches until something blocks it; the fan shows the facing direction.
  drawCone(ctx, e, game) {
    const [ex, ey] = e.eye();
    const range = SIGHT_RANGE;
    const alertish = e.state === 'alert' || e.state === 'windup';
    const g = ctx.createRadialGradient(ex, ey, 6, ex, ey, 460);
    const col = alertish ? '255,70,50' : e.state === 'investigate' || e.state === 'search' ? '255,170,60' : '255,236,180';
    g.addColorStop(0, `rgba(${col},${alertish ? 0.26 : 0.16})`);
    g.addColorStop(0.5, `rgba(${col},${alertish ? 0.1 : 0.05})`);
    g.addColorStop(1, `rgba(${col},0)`);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    const n = 22;
    for (let i = 0; i <= n; i++) {
      const a = -0.6 + (1.2 * i) / n;
      const dx = Math.cos(a) * e.dir;
      const dy = Math.sin(a);
      let d = 0;
      while (d < range && !game.world.blocksSight(ex + dx * d, ey + dy * d) && ex + dx * d > -10 && ex + dx * d < W + 10 && ey + dy * d < H) d += 8;
      ctx.lineTo(ex + dx * d, ey + dy * d);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  dustFromSteps(p, dt) {
    if (!p || p.state !== 'ground' || p.crouch || Math.abs(p.vx) < 90) {
      this.stepT = 0.05;
      return;
    }
    this.stepT -= dt;
    if (this.stepT > 0) return;
    this.stepT = 0.24;
    for (let i = 0; i < 2; i++) {
      this.fx.push({ k: 'dust', x: p.x - p.dir * 6, y: p.y - 2, vx: -p.dir * (20 + Math.random() * 30), vy: -Math.random() * 25, t: 0.3, d: 0.3 });
    }
  }

  drawPickup(ctx, e, t) {
    const x = e.x + 12;
    const y = e.y - 6 - Math.abs(Math.sin(t * 3)) * 3;
    ctx.save();
    ctx.shadowColor = 'rgba(255,220,120,0.9)';
    ctx.shadowBlur = 8;
    ctx.strokeStyle = '#2a2a2a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x - 12, y);
    ctx.lineTo(x + 12, y - 3);
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#ffe28a';
    ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(tr('fx_rifle'), x, y - 10);
  }

  drawMotes(ctx, t) {
    const th = this.theme;
    const warm = th.decor === 'trees' || th.decor === 'mesas';
    for (const m of this.motes) {
      const x = (((m.x + Math.sin(t * 0.4 * m.s + m.p) * 30 + t * 6 * m.s) % W) + W) % W;
      const y = (((m.y + Math.cos(t * 0.3 * m.s + m.p) * 20) % H) + H) % H;
      const a = 0.25 + 0.25 * Math.sin(t * 2 * m.s + m.p);
      ctx.fillStyle = warm ? `rgba(220,255,150,${a})` : `rgba(200,220,255,${a * 0.6})`;
      ctx.beginPath();
      ctx.arc(x, y, warm ? 1.6 : 1.1, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  drawForeground(ctx, t) {
    if (this.theme.decor !== 'trees') return;
    ctx.strokeStyle = 'rgba(12,30,20,0.85)';
    ctx.lineWidth = 3;
    const vines = [[40, 70], [210, 40], [520, 60], [760, 90], [905, 50]];
    for (const [x, len] of vines) {
      const sw = Math.sin(t * 0.8 + x) * 5;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.quadraticCurveTo(x + sw, len * 0.6, x + sw * 1.6, len);
      ctx.stroke();
      ctx.fillStyle = 'rgba(20,50,30,0.9)';
      for (let i = 1; i < 4; i++) {
        ctx.beginPath();
        ctx.ellipse(x + sw * (i / 3) * 1.4 + (i % 2 ? 5 : -5), (len * i) / 4, 5, 2.5, i % 2 ? 0.5 : -0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  drawVignette(ctx) {
    const { s, ox, oy } = this.view;
    const cx = ox + (W * s) / 2;
    const cy = oy + (H * s) / 2;
    const g = ctx.createRadialGradient(cx, cy, Math.min(W, H) * s * 0.45, cx, cy, Math.max(W, H) * s * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = g;
    ctx.fillRect(ox, oy, W * s, H * s);
  }

  drawEnemyMarker(ctx, e) {
    const x = e.x;
    const y = e.y - e.h - 12;
    if (e.state === 'alert' || e.state === 'windup') {
      ctx.fillStyle = '#ff3b30';
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('!', x, y);
    } else if (e.state === 'investigate' || e.state === 'search') {
      ctx.fillStyle = 'rgba(255,210,74,0.9)';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('?', x, y - 2);
    } else if (e.hearing > 0.02) {
      // Hearing meter: fills with your noise, drains when you are quiet.
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(x - 12, y - 4, 24, 5);
      ctx.fillStyle = e.hearing > 0.66 ? '#ff8a30' : '#ffd24a';
      ctx.fillRect(x - 12, y - 4, 24 * Math.min(1, e.hearing), 5);
      ctx.strokeStyle = '#ffd24a';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(x - 17, y - 2, 3.5, -1.2, 1.2);
      ctx.moveTo(x - 17 + 6, y - 2);
      ctx.arc(x - 17, y - 2, 6, -1, 1);
      ctx.stroke();
    }
    if (e.turnWarn && e.state !== 'alert' && e.state !== 'windup') {
      // About to turn around: a curved arrow pointing the new way.
      const d = -e.dir;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y - 16, 6, d > 0 ? Math.PI : 0, d > 0 ? Math.PI * 2 : Math.PI, d < 0);
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(x + d * 6 - 3, y - 16);
      ctx.lineTo(x + d * 6 + 3, y - 16);
      ctx.lineTo(x + d * 6, y - 11);
      ctx.fill();
    }
  }

  drawGripBar(ctx, p) {
    if (!p.alive || (p.grip >= 0.999 && p.state !== 'hang')) return;
    const x = p.x - 15;
    const y = p.y - p.h - 12;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(x - 1, y - 1, 32, 6);
    ctx.fillStyle = p.grip < 0.3 ? '#ff5a4a' : p.grip < 0.6 ? '#ffc24a' : '#5ae6c8';
    ctx.fillRect(x, y, 30 * Math.max(0, p.grip), 4);
  }

  drawPlayer(ctx, p, t, alpha) {
    const pose = playerPose(p);
    ctx.save();
    ctx.globalAlpha = alpha;
    drawFigure(ctx, {
      x: p.x,
      y: p.y,
      dir: p.dir,
      pose,
      t: p.anim,
      speed: Math.abs(p.vx),
      body: '#1c2733',
      dark: '#0e141b',
      head: '#141c24',
      skin: '#d9a77f',
      accent: '#1fd1b8',
      weapon: 'knife',
      gun: !!(p.gun && p.gun.ammo > 0),
      attack: p.attackT > 0,
      scale: 1,
      climbK: p.climb ? Math.min(1, p.climb.t / 0.3) : 0,
      deadT: p.deadT,
    });
    if (p.alive && alpha > 0.4) {
      // Visor glint.
      const hy = p.y - (p.crouch ? 28 : p.state === 'hang' ? 40 : 40);
      const hx = p.x + p.dir * 5;
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, 10);
      g.addColorStop(0, 'rgba(60,255,220,0.55)');
      g.addColorStop(1, 'rgba(60,255,220,0)');
      ctx.fillStyle = g;
      ctx.fillRect(hx - 10, hy - 10, 20, 20);
    }
    ctx.restore();
  }

  drawEnemy(ctx, e, t) {
    const look = ENEMY_LOOK[e.type];
    let pose = 'stand';
    if (e.state === 'dead') pose = 'dead';
    else if (e.state === 'windup') pose = 'windup';
    else if (e.moving && (['patrol', 'investigate', 'return'].includes(e.state) || (e.state === 'alert' && !e.cfg.gun))) pose = 'walk';
    if (e.state === 'alert' && e.cfg.gun) pose = 'aim';
    if (e.alive && e.airborne) pose = 'air';
    if (e.alive && e.climbing) pose = 'ladder';
    drawFigure(ctx, {
      x: e.x,
      y: e.y,
      dir: e.dir,
      pose,
      t: e.anim * (e.state === 'alert' ? 1.6 : 1),
      speed: 60,
      body: look.body,
      dark: look.dark,
      head: look.head,
      skin: '#c89370',
      accent: look.head,
      weapon: look.weapon,
      scale: e.cfg.heavy ? 1.12 : 1,
      heavy: e.cfg.heavy,
      listener: !!e.opts.hear,
      corpseAware: !!e.opts.corpses,
      deadT: e.deadT,
      falling: e.falling,
    });
  }

  drawRain(ctx, t) {
    ctx.strokeStyle = 'rgba(180,210,255,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < 70; i++) {
      const x = (i * 97 + t * 60) % W;
      const y = (i * 53 + t * 520) % H;
      ctx.moveTo(x, y);
      ctx.lineTo(x - 4, y + 12);
    }
    ctx.stroke();
  }

  drawAlertVignette(ctx, game, t) {
    const alert = game.enemies.some((e) => e.alive && (e.state === 'alert' || e.state === 'windup'));
    if (!alert) return;
    const a = 0.18 + 0.1 * Math.sin(t * 10);
    const g = ctx.createRadialGradient(this.cw / 2, this.ch / 2, Math.min(this.cw, this.ch) * 0.35, this.cw / 2, this.ch / 2, Math.max(this.cw, this.ch) * 0.7);
    g.addColorStop(0, 'rgba(255,0,0,0)');
    g.addColorStop(1, `rgba(255,20,20,${a})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, this.cw, this.ch);
  }

  // ---- effects ----
  onEvent(ev) {
    switch (ev.type) {
      case 'kill':
        if (ev.silent) this.punch = { x: ev.x, y: ev.y, t: 0.22, d: 0.22 };
        for (let i = 0; i < 10; i++) this.fx.push({ k: 'puff', x: ev.x, y: ev.y, vx: (Math.random() - 0.5) * 90, vy: -Math.random() * 80, t: 0.6, d: 0.6 });
        this.fx.push({ k: 'text', x: ev.x, y: ev.y - 34, text: ev.silent ? tr('fx_silent') : tr('fx_loud'), color: ev.silent ? CAUSE_COLORS.silent : CAUSE_COLORS.loud, t: 1, d: 1 });
        break;
      case 'noise':
        this.fx.push({ k: 'ring', x: ev.x, y: ev.y, r: ev.radius, t: 0.7, d: 0.7, color: '255,210,80' });
        break;
      case 'alarm':
        this.flash = { color: 'rgba(255,30,30,A)', a: 0.35, t: 0.5, d: 0.5 };
        this.fx.push({ k: 'text', x: W / 2, y: 90, text: tr('fx_alarm'), color: '#ff4a3a', t: 1.4, d: 1.4, big: true });
        break;

      else if ((e.state === 'investigate' || e.state === 'search') && level < 1) level = 1;

  ctx.fillStyle = g.exitOpen ? '#6dffa6' : '#ffd24a';
